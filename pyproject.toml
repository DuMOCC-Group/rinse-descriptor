[project]
name = "rinse-descriptor"
version = "3.2.0"
description = "Reciprocal-space INvariant Spectral Embedding (RINSE) descriptors for crystalline materials"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["crystallography", "materials science", "machine learning", "descriptors"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "cctbx-base>=2025.11; python_version >= '3.9'",
]

[project.scripts]
rinse = "rinse_descriptor._cli:main"

[dependency-groups]
dev = [
    "hatchling>=1.25",
    "pytest>=8.0",
    "pytest-benchmark>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "marimo>=0.9; python_version >= '3.10'",
    "matplotlib>=3.8; python_version >= '3.9'",
    "pre-commit>=4.6.0; python_version >= '3.10'",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["python/rinse_descriptor"]

[tool.ruff]
line-length = 100
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "NPY"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# --capture=sys uses Python-level capture instead of the default fd-level
# capture.  cctbx's C extensions segfault when fd capture is active at the
# time they are first loaded (libstdc++ / fork interaction on Linux).
addopts = "-v --capture=sys"
